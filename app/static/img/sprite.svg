  <symbol id="briefcase" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12h18"/></g></symbol>
  <symbol id="quote" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7C7 7 5 9 5 11.5V17h5v-5H7.6c0-1.8 1-3 2.4-3.3zM18.5 7C16 7 14 9 14 11.5V17h5v-5h-2.4c0-1.8 1-3 2.4-3.3z"/></g></symbol>

