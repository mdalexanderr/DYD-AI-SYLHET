<svg xmlns="http://www.w3.org/2000/svg" style="display:none"
     aria-hidden="true" focusable="false">
  <!--
    §7.6.1 — the ONE inlined icon sprite.

    Every icon on the site comes from here. That is what makes "no emoji
    iconography" enforceable rather than aspirational: there is no icon font, no
    emoji fallback in any stack, and no per-page SVG.

    Usage:  <svg class="size-4" aria-hidden="true"><use href="/static/img/sprite.svg#search"/></svg>
            plus a visually-hidden <span class="sr-only">লেবেল</span>, or an
            aria-label on the control — Bangla on every icon-only control (§7.8).

    Conventions:
      · 24×24 viewBox, stroke = currentColor, fill = none, so an icon inherits
        the text colour and needs no per-instance CSS.
      · stroke-width 1.75 — heavy enough to survive at 16px, light enough not to
        shout at 24px, and consistent with the 1px document rules.
      · Geometry only. No illustrations, no brand marks beyond the simple
        Facebook glyph, nothing decorative.
  -->
  <defs/>

  <!-- ── Navigation ──────────────────────────────────────────────────────── -->
  <symbol id="menu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></g></symbol>
  <symbol id="close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
  <symbol id="chevron-left" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></g></symbol>
  <symbol id="chevron-right" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></g></symbol>
  <symbol id="chevron-down" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></g></symbol>
  <symbol id="chevron-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></g></symbol>
  <symbol id="arrow-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></g></symbol>
  <symbol id="arrow-down" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></g></symbol>
  <symbol id="arrow-right" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></symbol>
  <symbol id="external-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h6v6M19 5l-8 8"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></g></symbol>
  <symbol id="search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></g></symbol>
  <symbol id="filter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></g></symbol>

  <!-- ── Contact / institutional ─────────────────────────────────────────── -->
  <symbol id="phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 0 0 5.5 5.5L15.5 13l5 2v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 5.2 2 2 0 0 1 6 3z"/></g></symbol>
