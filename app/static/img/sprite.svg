  <symbol id="facebook" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8.5V6.8c0-.9.4-1.3 1.5-1.3H17V3h-2.2C12.6 3 11.6 4.4 11.6 6.5v2H10v2.4h1.6V21H14v-10h2.1l.4-2.5H14z"/></g></symbol>
  <symbol id="building" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 21V10h4a1 1 0 0 1 1 1v10M3 21h18"/><path d="M7 7h2M7 11h2M7 15h2"/></g></symbol>

